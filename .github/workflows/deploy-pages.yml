name: Deploy to GitHub Pages

# Builds the Parcel prototype and publishes the static output to the gh-pages
# branch. GitHub Pages then serves it at:
#   https://ha-llelujah3528.github.io/codesandbox-test/
on:
  push:
    branches:
      - main
      - claude/panel-de-pon-game-design-r17n2y
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (Parcel)
        run: |
          rm -rf dist .cache
          npx parcel build index.html --public-url ./ --no-source-maps
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
