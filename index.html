<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>PANEL ASSAULT // パネルでポン proto</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <button id="pause-btn" aria-label="pause">❚❚</button>
      <div id="touch-controls" aria-hidden="true">
        <div class="dpad">
          <button data-act="up">▲</button>
          <div class="dpad-mid">
            <button data-act="left">◀</button>
            <button data-act="right">▶</button>
          </div>
          <button data-act="down">▼</button>
        </div>
        <div class="actions">
          <button data-act="swap" class="primary">SWAP</button>
          <button data-act="raise">RAISE</button>
        </div>
      </div>
      <div id="boot-hint">TAP / 何かキーで起動</div>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
